<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap To Translate — мульти-переводчик</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="Бесплатный онлайн мульти-переводчик. Google и Яндекс в одном интерфейсе." />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>🌐 Tap To Translate</h1>
      <span class="app__tagline">Google &nbsp;·&nbsp; Яндекс &nbsp;·&nbsp; мгновенно</span>
    </header>

    <!-- БЛОК 1. Панель управления -->
    <section class="controls" aria-label="Панель управления">
      <div class="controls__item">
        <label for="provider" class="controls__label">Провайдер</label>
        <div class="select-wrap">
          <select id="provider" class="select">
            <optgroup label="🟢 Без ключа (бесплатно)">
              <option value="google">Google Translate</option>
              <option value="mymemory">MyMemory Translate</option>
            </optgroup>
            <optgroup label="🔒 Требует API-ключ">
              <option value="yandex"     data-locked="1">Яндекс Переводчик</option>
              <option value="microsoft"  data-locked="1">Microsoft Translate</option>
              <option value="deepl"      data-locked="1">DeepL</option>
              <option value="baidu"      data-locked="1">Baidu Translate</option>
              <option value="gemini"     data-locked="1">Gemini AI Translate</option>
              <option value="openai"     data-locked="1">ChatGPT Translate</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="controls__item controls__item--lang">
        <label for="srcLang" class="controls__label">Исходный язык</label>
        <div class="select-wrap">
          <select id="srcLang" class="select select--lang"></select>
        </div>
      </div>

      <button id="reverse" class="reverse" title="Поменять направление перевода" aria-label="Поменять языки местами">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M7 5l-4 4 4 4v-3h7v-2H7V5zm10 14l4-4-4-4v3h-7v2h7v3z"/>
        </svg>
      </button>

      <div class="controls__item controls__item--lang">
        <label for="dstLang" class="controls__label">Целевой язык</label>
        <div class="select-wrap">
          <select id="dstLang" class="select select--lang"></select>
        </div>
      </div>
    </section>

    <!-- БЛОК 2. Текстовая зона -->
    <section class="texts" aria-label="Текстовые поля">
      <div class="text-card text-card--src">
        <textarea id="srcText" class="textarea" placeholder="Введите или вставьте текст для перевода…" spellcheck="false"></textarea>
        <button class="field-btn field-btn--clear" id="clearSrc" title="Очистить" aria-label="Очистить текст">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3 1.4 1.4z"/></svg>
        </button>
        <button class="field-btn field-btn--copy field-btn--br" id="copySrc" title="Копировать" aria-label="Копировать исходный текст">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
        <div class="counter" id="srcCounter">0</div>
      </div>

      <div class="text-card text-card--dst">
        <textarea id="dstText" class="textarea textarea--out" readonly placeholder="Здесь появится перевод…" spellcheck="false"></textarea>
        <div class="field-btn field-btn--copy field-btn--br" id="copyDst" title="Копировать" role="button" tabindex="0" aria-label="Копировать перевод">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
        </div>
        <div class="badge" id="provBadge">Google</div>
      </div>
    </section>

    <!-- БЛОК 3. OCR-панель (видна сразу на смартфоне, снизу) -->
    <section class="ocr-bar" aria-label="Распознавание текста с изображения">
      <input type="file" id="ocrFile" accept="image/*" hidden />
      <button id="ocrBtn" class="ocr-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 4h4V2H2v6h2V4zm10-2v2h4v4h2V2h-6zm4 16h-4v2h6v-6h-2v4zM4 14H2v6h6v-2H4v-4zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
        </svg>
        <span>📷 OCR</span>
      </button>
      <div class="ocr-progress" id="ocrProgress" aria-live="polite"></div>
      <select id="ocrLang" class="ocr-lang" aria-label="Язык распознавания">
        <option value="rus+eng">Рус + Eng (по умолчанию)</option>
        <option value="rus">Только русский</option>
        <option value="eng">Только English</option>
        <option value="rus+eng+ukr">Рус + Eng + Укр</option>
        <option value="rus+eng+kor+chi_sim+chi_tra+tha+jpn">Азиатские + EN</option>
        <option value="rus+eng+spa+fra+deu">Европейские + RU</option>
      </select>
    </section>

    <div class="status-line">
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <span class="hint" id="hint">Подсказка: вводите текст — перевод появится через ~1 сек</span>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="tooltip" role="alert"></div>

  <footer class="footer">
    <span>Бесплатно · без регистрации · работает на GitHub Pages</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="languages.js"></script>
  <script src="ocr.js"></script>
  <script src="app.js"></script>
</body>
</html>
